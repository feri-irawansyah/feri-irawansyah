# Rate limit zones (defined at http context level, outside server blocks).
# general: 30 req/s per IP for all traffic.
# login:   5 req/s per IP for the login endpoint — matches app-level limiter.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# Redirect www → non-www (canonical: feri-irawansyah.my.id).
# Certbot will add a matching listen 443 ssl block here for www HTTPS → HTTPS redirect.
server {
    listen 80;
    server_name www.feri-irawansyah.my.id;
    return 301 https://feri-irawansyah.my.id$request_uri;
}

# Main site. Certbot edits this block in-place to add listen 443 ssl + HTTP→HTTPS redirect.
server {
    listen 80;
    server_name feri-irawansyah.my.id;

    # Match the app's own upload limit (see MAX_UPLOAD_BYTES in
    # src/server/src/uploads/mod.rs) — keep these two in sync.
    client_max_body_size 2m;

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Custom error pages served directly by Nginx (no app needed).
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 502 503 504 /502.html;
    location ~ ^/(404|429|502)\.html$ {
        root /opt/feri-irawansyah/public;
        internal;
    }

    # Static site assets — served straight off disk instead of proxied to the
    # app, using the *.br siblings scripts/build.sh precompresses at build
    # time. brotli_static serves those directly to clients that advertise
    # `br` support; falls through to the plain uncompressed file otherwise.
    # Requires the nginx brotli module (installed by install.sh) — without
    # it this directive is just ignored and everything serves uncompressed.
    # Filenames here aren't content-hashed, so no long-lived/immutable
    # caching — rely on the default Last-Modified/ETag revalidation, which
    # correctly busts on redeploy since the file's mtime changes when
    # build.sh recopies it.
    location /pkg/ {
        alias /opt/feri-irawansyah/site/pkg/;
        brotli_static on;
    }

    location /public/ {
        alias /opt/feri-irawansyah/public/;
        brotli_static on;
    }

    # Stricter rate limit on login endpoint.
    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
