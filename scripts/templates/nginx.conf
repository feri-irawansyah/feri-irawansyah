# Redirect www → non-www (canonical: feri-irawansyah.my.id).
# Certbot will add a matching listen 443 ssl block here for www HTTPS → HTTPS redirect.
server {
    listen 80;
    server_name www.feri-irawansyah.my.id;
    return 301 https://feri-irawansyah.my.id$request_uri;
}

# Main site. Certbot edits this block in-place to add listen 443 ssl + HTTP→HTTPS redirect.
server {
    listen 80;
    server_name feri-irawansyah.my.id;

    # Match the app's own upload limit (see MAX_UPLOAD_BYTES in
    # src/views/src/features/uploads/mod.rs) — keep these two in sync.
    client_max_body_size 2m;

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
