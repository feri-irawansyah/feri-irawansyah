[package]
name = "services"
version = "0.1.0"
edition = "2024"

[dependencies]
modules = { path = "../modules" }
repositories = { path = "../repositories" }
connectors = { path = "../connectors" }

anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
