[package]
name = "repositories"
version = "0.1.0"
edition = "2024"

[dependencies]
modules = { path = "../modules" }

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
redis = { version = "1.5.0", features = [
    "connection-manager",
    "tokio-native-tls-comp",
] }
serde_json = "1.0.151"
serde = "1.0.229"
